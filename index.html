
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Header -->
        <header class="header">
            <div class="logo">
                <div class="logo-icon">✓</div>
                <div>
                    <h1>My To-Do List</h1>
                    <p>Plan · Organize · Achieve</p>
                </div>
            </div>

            <button id="themeToggle" class="theme-btn">🌙</button>
        </header>

        <main class="content">

            <!-- Add Task -->
            <form id="taskForm" class="add-task">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter your task..."
                    required
                >

                <select id="priorityInput">
                    <option value="High">High</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="Low">Low</option>
                </select>

                <button type="submit">+ Add Task</button>
            </form>

            <!-- Filters and Search -->
            <div class="toolbar">
                <div class="filters">
                    <button class="filter active" data-filter="all">
                        All
                    </button>

                    <button class="filter" data-filter="pending">
                        Pending
                    </button>

                    <button class="filter" data-filter="completed">
                        Completed
                    </button>
                </div>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="🔍 Search tasks..."
                >
            </div>

            <!-- Task List -->
            <div id="taskList" class="task-list"></div>

            <!-- Footer Progress -->
            <footer class="footer">
                <div class="progress-info">
                    <span>✓</span>
                    <p id="progressText">0 of 0 tasks completed</p>
                </div>

                <div class="progress-bar">
                    <div id="progressFill"></div>
                </div>

                <button id="clearCompleted" class="clear-btn">
                    🗑 Clear Completed
                </button>
            </footer>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
